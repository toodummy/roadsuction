async function share(){const t=shareText();try{if(navigator.share){await navigator.share({title:'ROADSTER',text:t});return}}catch(e){if(e.name==='AbortError')return}

// ---- update
function landOK(){const u=upY();return u>.8&&Math.abs(P.pitch-P.pT)<.5&&Math.abs(P.roll-P.rT)<.5}

function update(dt){
 if(st==='play'&&!paused){
  introT+=dt;const sp=curSpeed();P.boostT=Math.max(0,P.boostT-dt);if(P.boostT>0&&Math.random()<.9)plume('rear',2);

  P.bank+=(-P.vx*.05-P.bank)*Math.min(1,dt*8);
  if(P.mode==='loop'){const L=P.loop,o=L.o;L.th+=sp*dt/o.R*.85;const th=Math.min(L.th,L.max);const [y,z]=pathPt(o,th);P.y=y;dist=-z;P.pitch=P.pT=th;if(Math.random()<.6)plume('under',1);
   if(L.th>=L.max){if(o.kind==='loop'){P.mode='ground';P.loop=null;P.pitch=P.pT=0;P.y=0;loops++;combo++;score+=500*combo;pop('LOOP! +'+500*combo,'#5cf');tone(660,.15,'square',.1);setTimeout(()=>tone(990,.25,'square',.1),90);shake=.3}
    else{P.mode='ceil';P.ceil=o.deck;P.loop=null;P.pitch=P.pT=Math.PI;P.y=o.deck.h;loops++;score+=250*combo;pop('SUCTION ON — upside down!','#5cf')}}
  }else{
   dist+=sp*dt;score+=sp*dt*.35*combo;const z=-dist;
   if(P.mode==='ground'){P.fuel=Math.min(1,P.fuel+dt*.8);P.y=0;if(onGap(z)){P.mode='air';P.vy=0}}
   else if(P.mode==='ceil'){P.fuel=Math.min(1,P.fuel+dt*.5);ceilT+=dt;score+=dt*60*combo;if(Math.random()<.3)emit(P.x+(Math.random()-.5)*2,P.y-.1,z,0,-1,0,CY,.4);const c=ceilAt(z);if(!c){P.mode='air';P.vy=0;P.ceil=null;pop('DROP — flip!','#ffd23a')}else P.y=c.h}
   else{ // air
    const u=upY();if(inp.thrust&&P.fuel>0){P.vy+=u*38*dt;P.fuel-=dt*.35;plume('under',1)}
    P.vy-=26*dt;P.vy=Math.max(-30,Math.min(10,P.vy));P.y+=P.vy*dt;
    const rate=10*dt;const mv=(a,t)=>a+Math.sign(t-a)*Math.min(rate,Math.abs(t-a));const op=P.pitch,or=P.roll;P.pitch=mv(P.pitch,P.pT);P.roll=mv(P.roll,P.rT);
    if(P.trick&&P.pitch===P.pT&&P.roll===P.rT){const full=P.trick.left>4;flips++;if(full)combo++;const pts=(full?200:90)*combo;score+=pts;pop((full?(P.trick.axis==='p'?'FLIP':'BARREL ROLL'):'HALF FLIP')+' x'+combo,'#ffd23a');tone(880,.12,'square',.08);P.trick=null}
    const c=ceilAt(z);
    if(c&&P.vy>0){if(u<-.8&&P.y>=c.h-.05){P.mode='ceil';P.ceil=c;P.y=c.h;P.vy=0;snap();P.trick=null;shake=.15;tone(200,.15,'sine',.15,400);pop('CEILING STICK! x'+(++combo),'#5cf')}
     else if(u>=-.8&&P.y+1.25>=c.h){P.y=c.h-1.25;P.vy=-3;shake=.3;tone(70,.1,'square',.1)}}
    if(P.y<=0&&P.vy<=0&&!onGap(z)){if(P.y>-1){if(!landOK())return over('Landed on your roof. Wheels down!');snap();P.trick=null;P.mode='ground';P.y=0;P.vy=0;shake=Math.max(shake,.15);tone(90,.08,'sine',.18);for(let i=0;i<14;i++)emit(P.x+(Math.random()-.5)*2,.1,z,(Math.random()-.5)*5,Math.random()*2,0,STEAM,.4)}}
    if(P.y<-7)return over('Fell into the void.');
   }
   // structures & cars
   const yc=P.y+upY()*.6;
   for(const o of obs){
    if(o.kind==='car'){if(Math.abs(P.x-o.x)<o.w/2+.85&&z-2.4<o.z0&&z+2.4>o.z1&&yc-.6<o.h&&yc+.6>0)return over('Hit a '+(o.h>3?'truck':'vehicle')+'.');if(!o.cl&&z+2.4<o.z1){o.cl=true;if(Math.abs(P.x-o.x)<o.w/2+1.5){hopped++;score+=60*combo}}}
    else if((o.kind==='loop'||o.kind==='cramp')&&!o.done&&z<=o.z){o.done=true;if(P.mode==='ground'){P.mode='loop';P.loop={o,th:0,max:o.kind==='loop'?Math.PI*2:Math.PI};tone(300,.5,'sawtooth',.07,900)}}
   }
  }
  for(let i=obs.length-1;i>=0;i--){const o=obs[i],far=o.kind==='cramp'?o.deck.z1:o.kind==='loop'?o.z-o.R-o.k*6.3:o.z1;if(far>-dist+30){S.remove(o.m);obs.splice(i,1)}}
  ceils=ceils.filter(c=>c.z1<-dist+30);
  while(nextZ>-dist-280){const len=spawn(nextZ);nextZ-=len+18+Math.random()*30+sp*.3}
  $('sc').textContent=Math.floor(score);$('sub').textContent=`BEST ${best} · ${Math.round(sp*2.6)} mph · x${combo}${P.mode==='ceil'?' · UPSIDE DOWN':''}`;$('fu').style.width=Math.max(0,P.fuel*100)+'%';$('fu').style.background=P.fuel>.15?'#5cf':'#f44';
  $('big').textContent=introT<.8?'0-60: '+introT.toFixed(1)+'s':introT<2?'0-60: 0.8s 😤':'';
 }
 if(st==='title'&&!SHOW)dist+=14*dt;
 // car transform
 CAR.position.set(P.x,P.y,-dist);trickQ(P.pitch,P.roll+P.bank,BODY.quaternion);
 const sp=curSpeed();for(const w of wheels)w.rotation.x-=sp*dt/.38;
 let fsum=0;for(const k in FIRE){FIRE[k]=Math.max(0,FIRE[k]-dt);fsum+=FIRE[k]}for(const z of NZ)z.m.material.emissiveIntensity=FIRE[z.k]>0?6:.6;glow.intensity=Math.min(8,fsum*25);
 // scroll road + buildings
 for(const r of RC){if(r.position.z>-dist+RL*1.5)r.position.z-=RC.length*RL;r.visible=!onGap(r.position.z)}
 for(const b of BLD)if(b.position.z>-dist+40)b.position.z-=560;
 FAR.position.z=-dist;
 // particles
 for(let i=0;i<PN;i++){const p=PA[i];if(p.l>0){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.gr)p.vy-=20*dt;else{p.vx*=.96;p.vy*=.96}const f=Math.max(0,p.l/p.L);pp[i*3]=p.x;pp[i*3+1]=p.y;pp[i*3+2]=p.z;pc[i*3]=p.r*f;pc[i*3+1]=p.g*f;pc[i*3+2]=p.b*f}else pp[i*3+1]=-999}
 pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;
 const sf=st==='play'?Math.max(0,(sp-45)/35):0;SL.material.opacity=Math.min(.6,sf*.5);
 for(let i=0;i<SLN;i++){const d=SLD[i];d.z+=sp*dt*1.5;if(d.z>-dist+5||d.z<-dist-90){const a=Math.random()*6.28,r=5+Math.random()*10;d.x=P.x+Math.cos(a)*r;d.y=P.y+3+Math.sin(a)*r*.6;d.z=-dist-30-Math.random()*55}
  slp[i*6]=d.x;slp[i*6+1]=d.y;slp[i*6+2]=d.z;slp[i*6+3]=d.x;slp[i*6+4]=d.y;slp[i*6+5]=d.z-3-sp*.1}slg.attributes.position.needsUpdate=true;
 // camera
 if(SHOW||st==='title'){const t=performance.now()/1000*(SHOW?.35:.25)+(SHOW?2.2:0),r=SHOW?6.2:7.5;CAM.position.set(P.x+Math.sin(t)*r,SHOW?1.6:2.2,-dist+Math.cos(t)*r);CAM.lookAt(P.x,.6,-dist);CAM.fov=SHOW?42:55;CAM.updateProjectionMatrix()}
 else{const tgt=new THREE.Vector3(P.x*.7,3.4+P.y*.75,-dist+9.5);CAM.position.lerp(tgt,Math.min(1,dt*7));shake*=Math.pow(.02,dt);CAM.position.x+=(Math.random()-.5)*shake;CAM.position.y+=(Math.random()-.5)*shake;
  CAM.lookAt(P.x*.85,1+P.y*.85,-dist-12);const tf=62+(st==='play'?sp*.22+(P.boostT>0?8:0):0);CAM.fov+=(tf-CAM.fov)*Math.min(1,dt*3);CAM.updateProjectionMatrix()}
 if(popT>0){popT-=dt;if(popT<=0)$('pop').style.opacity=0}
 cyberTick(dt);music();
}
let fa=0,fn=0;function adapt(dt){fa+=dt;fn++;if(fa>2){const fps=fn/fa;if(fps<40&&bloomOn){bloomOn=false;fxBtn();pop('LOW FPS: FX OFF','#ffe600')}else if(fps<45&&PR>.75){PR=Math.max(.75,PR-.25);R.setPixelRatio(PR);rs()}else if(fps>58&&PR<Math.min(2,devicePixelRatio)){PR=Math.min(2,PR+.25);R.setPixelRatio(PR);rs()}fa=fn=0}}
let last=performance.now();function frame(t){const dt=Math.max(0,Math.min(.033,(t-last)/1000||0));last=t;update(dt);if(!SHOW&&!AUTO)adapt(dt);renderFrame();requestAnimationFrame(frame)}
if(SHOW){st='showcase';$('ui').innerHTML='';P.x=0;dist=0;for(const k in NDEF)plume(k,25,true);setInterval(()=>{for(const k in NDEF)plume(k,3)},60)}
else title();

 for(const k of['under','top','right','rear'])plume(k,30,true);setInterval(()=>{if(st==='play'){plume('under',3);plume('right',2);if(P.mode==='ground'){thrustOn();trick('p',-1)}}},80)}
